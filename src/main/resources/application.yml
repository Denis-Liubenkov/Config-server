server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
    config:
      server:
        native:
          search-locations: "[classpath:/, classpath:/config, classpath:/config/{application}, classpath:/config/{application}/{profile}]"
        bootstrap: true
